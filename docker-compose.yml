version: '3.9'

services:
  database:
    image: postgres:15-alpine
    container_name: agri_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-agri_compta}
      POSTGRES_USER: ${DB_USER:-agri_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-agri_user} -d ${DB_NAME:-agri_compta}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - agri_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agri_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-agri_user}:${DB_PASSWORD}@database:5432/${DB_NAME:-agri_compta}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: ${API_PORT:-3000}
      TIMEZONE: ${TIMEZONE:-Africa/Casablanca}
      CURRENCY: ${CURRENCY:-MAD}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - agri_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api}
    container_name: agri_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - agri_network

  nginx:
    image: nginx:alpine
    container_name: agri_nginx
    restart: unless-stopped
    ports:
      - "8888:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - agri_network

volumes:
  postgres_data:
    driver: local

networks:
  agri_network:
    driver: bridge
